[package]
name = "sn-terrain"
version = "0.0.0"
edition = "2024"
description = "Subnautica modding tools for terrain editing and patching"
repository = "https://github.com/Esper89/sn-terrain"
license = "AGPL-3.0-only"
keywords = ["subnautica", "modding", "terrain", "octrees"]
categories = ["game-development"]
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
ffi = []
editor = ["dep:ahash", "dep:quick_cache"]

[dependencies]
ahash = { version = "0.8", optional = true }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std", "latest_stable_rust"] }
fearless_simd = { version = "1.3", features = ["force_support_fallback"] }
fearless_simd_macros = "0.1"
gnat = { version = "0.1", features = ["macros", "std"] }
quick_cache = { version = "0.7", optional = true }
seq-macro = "0.3"
thiserror = "2.0"
triomphe = "=0.1.17"

[dev-dependencies]
rand = "=0.10.4"
